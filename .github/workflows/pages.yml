name: Publicar UniHub no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Montar somente os arquivos do aplicativo
        # Evita publicar schema.sql, documentos internos e o workflow.
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js assets _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
